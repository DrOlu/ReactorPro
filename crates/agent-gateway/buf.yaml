# buf module configuration (v2 schema). The module root is set at crates/agent-gateway/ so the v2 frame shell can import shared business messages.
version: v2
modules:
  - path: .
    excludes:
      # Exclude third-party .proto files inside the WebUI node_modules.
      - web
lint:
  use:
    - STANDARD
  except:
    # The legacy layout proto/<version>/ predates buf; moving directories would change import paths and break the Rust build.rs and generated artifacts, so it is left as is.
    - PACKAGE_DIRECTORY_MATCH
  # The published enum naming in gateway.proto stays unchanged; only the necessary lint exemptions are kept.
  ignore_only:
    ENUM_VALUE_PREFIX:
      - proto/v2/gateway.proto
    ENUM_ZERO_VALUE_SUFFIX:
      - proto/v2/gateway.proto
breaking:
  use:
    # Protects compatibility for both the Protobuf binary wire format and the proto JSON representation.
    - WIRE_JSON
