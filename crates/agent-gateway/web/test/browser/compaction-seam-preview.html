<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Compaction seam preview</title>
    <style>
      body { margin: 0; padding: 24px; background: hsl(var(--background)); }
      .frame { width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
      .label { font: 500 11px/1 ui-sans-serif, system-ui; letter-spacing: .08em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="frame">
      <section>
        <div class="label" id="label-settled">Settled · history</div>
        <div id="settled"></div>
      </section>
      <section>
        <div class="label">Streaming · compacting right now</div>
        <div id="compacting"></div>
      </section>
      <section>
        <div class="label">Streaming · continuation after compaction</div>
        <div id="live"></div>
      </section>
    </div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import "/src/index.css";
      import { AssistantBubble } from "@liveagent/ui/components/chat/AssistantBubble.tsx";
      import { createCompactionSeamRound } from "@liveagent/ui/lib/chat/replyContinuity.ts";

      const seam = {
        key: "summary-seg-1",
        summaryId: "sum-1",
        content:
          "## Completed\n- Built-in tool regression rounds 1-3 all passed (Read/Write/Edit/Glob/Grep/Bash).\n- Temporary artifacts are in `tool-test-round3/`, pending cleanup.\n\n## TODO\n- Clean up the temporary directory and write to memory.",
        coveredMessageCount: 94,
        generatedBy: { providerId: "deepseek", model: "deepseek-v4-flash" },
        contextUsageTokens: 18_400,
      };

      const write = (id, path, content, extra = {}) => ({
        kind: "tool",
        item: {
          toolCall: { type: "toolCall", id, name: "Write", arguments: { path, content } },
          toolResult: {
            role: "toolResult",
            toolCallId: id,
            isError: false,
            content: [{ type: "text", text: "ok" }],
            details: { kind: "write", path, displayPath: path, ...extra },
          },
        },
      });
      const bash = (id, command) => ({
        kind: "tool",
        item: {
          toolCall: { type: "toolCall", id, name: "Bash", arguments: { command } },
          toolResult: {
            role: "toolResult",
            toolCallId: id,
            isError: false,
            content: [{ type: "text", text: "done" }],
          },
        },
      });
      const thinking = (id, text) => ({ kind: "thinking", id, text });

      const firstHalf = [
        {
          round: 1,
          key: "r1",
          blocks: [
            thinking("th-1", "First confirm which built-in tools are available in the workspace to test."),
            write("w1", "tool-test-round3/data.json", '{\n  "ok": true,\n  "round": 3\n}\n'),
            write("w2", "tool-test-round3/notes.md", "# notes\n\n- a\n- b\n- c\n"),
            bash("b1", "ls -la tool-test-round3"),
          ],
          meta: { stopReason: "toolUse" },
        },
      ];
      const secondHalfSettled = [
        {
          round: 1,
          key: "p1:r1",
          blocks: [
            thinking("th-2", "Context has been compacted; continue finishing the remaining two files and clean up."),
            write("w3", "tool-test-round3/sub/nested.txt", "nested\n"),
            write("w4", "tool-test-round3/test-image.svg", "<svg/>\n"),
          ],
          meta: { stopReason: "toolUse" },
        },
        {
          round: 2,
          key: "p1:r2",
          blocks: [
            {
              kind: "text",
              id: "text-1",
              text: "Round 3 of the built-in system tool regression tests is fully complete (all 6 tasks completed); temporary artifacts have been cleaned up and the conclusions written to memory.\n\n### Overall conclusion\n\n| Dimension | Result |\n| --- | --- |\n| File read/write | ✅ |\n| Command execution | ✅ |",
            },
          ],
          meta: { stopReason: "stop" },
        },
      ];

      const settledRounds = [...firstHalf, createCompactionSeamRound(seam), ...secondHalfSettled];
      createRoot(document.querySelector("#settled")).render(
        React.createElement(AssistantBubble, {
          rounds: settledRounds,
          isLive: false,
          isStreaming: false,
          renderMode: "static",
          durationMs: 6 * 60_000 + 41_000,
          workdir: "/tmp/ws",
        }),
      );

      const liveRounds = [
        ...firstHalf,
        createCompactionSeamRound(seam),
        {
          round: 1,
          key: "p1:r1",
          blocks: [
            thinking("th-2", "Context has been compacted; continue finishing the remaining two files and clean up."),
            {
              kind: "tool",
              item: {
                toolCall: {
                  type: "toolCall",
                  id: "w3",
                  name: "Write",
                  arguments: { path: "tool-test-round3/sub/nested.txt", content: "nested\n" },
                },
              },
            },
          ],
          runningToolCallIds: ["w3"],
          thinkingOpen: false,
        },
      ];
      createRoot(document.querySelector("#live")).render(
        React.createElement(AssistantBubble, {
          rounds: liveRounds,
          isLive: true,
          isStreaming: true,
          renderMode: "streaming",
          workdir: "/tmp/ws",
        }),
      );

      createRoot(document.querySelector("#compacting")).render(
        React.createElement(AssistantBubble, {
          rounds: firstHalf.map((round) => ({ ...round, runningToolCallIds: [], thinkingOpen: false })),
          isLive: true,
          isStreaming: true,
          renderMode: "streaming",
          toolStatus: "Compacting context",
          toolStatusVariant: "compaction",
          workdir: "/tmp/ws",
        }),
      );

      window.__ready = true;
    </script>
  </body>
</html>
