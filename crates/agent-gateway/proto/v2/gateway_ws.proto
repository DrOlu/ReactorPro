// v2 unified wire protocol (WebSocket+Protobuf): the frame shell for the three links
// /ws/v2 (browser), /ws/v2/agent (desktop), and /ws/v2/terminal (terminal data plane).
// One WS binary message carries one frame; a text frame is a protocol error. The first
// frame must be hello; an authentication failure closes with close code 4401. Business
// payloads reuse the v2 messages of gateway.proto (the single source of truth for all
// three ends); this file defines only the frame shell and gateway-local payloads.
syntax = "proto3";

package liveagent.gateway.v2;

import "proto/v2/gateway.proto";

option go_package = "github.com/liveagent/agent-gateway/internal/proto/v2;gatewayv2";

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

// ClientRole distinguishes which end a connection on /ws/v2/terminal belongs to
// (both ends of that link share a single path and are distinguished by hello.role).
enum ClientRole {
  CLIENT_ROLE_UNSPECIFIED = 0;
  CLIENT_ROLE_BROWSER = 1;
  CLIENT_ROLE_AGENT = 2;
}

// ClientHello is the first frame of every v2 connection.
message ClientHello {
  // Protocol version, currently always 2; unknown versions are rejected by the server.
  uint32 protocol_version = 1;
  ClientRole role = 2;
  // Gateway access token; the server performs a constant-time comparison.
  string token = 3;
  // CLIENT_ROLE_AGENT must declare its identity via agent_id; the browser role must
  // also explicitly bind the data-plane target via agent_id on /ws/v2/terminal.
  string agent_id = 4;
  string agent_version = 5;
  // Client identifier (e.g. "webui" / "desktop"), used only for observability and logging.
  string client_name = 6;
  string client_version = 7;
  // Optional feature identifiers supported by this client. Reliable desktop
  // chat ingress is negotiated with "CHAT_INGRESS_V1".
  repeated string capabilities = 8;
}

// ServerHello is the server's reply to ClientHello; when ok=false the connection is closed immediately.
message ServerHello {
  bool ok = 1;
  string message = 2;
  // Returned only for the agent role.
  string session_id = 3;
  // Server Unix-seconds timestamp, for client clock calibration.
  int64 server_time = 4;
  // Server heartbeat period and maximum message size; the client should configure its
  // local watchdog and fragmentation accordingly.
  uint32 heartbeat_period_seconds = 5;
  uint64 max_message_bytes = 6;
  // Feature identifiers supported by the gateway.
  repeated string capabilities = 7;
}

// PingFrame / PongFrame are application-layer heartbeats: WS control-frame ping probes
// the network stack, while these frames probe page JS/event-loop liveness.
message PingFrame {
  int64 timestamp = 1;
}

message PongFrame {
  int64 timestamp = 1;
}

// AckResult is the generic acknowledgement for local operations.
message AckResult {
  bool ok = 1;
}

// ---------------------------------------------------------------------------
// Browser link (/ws/v2)
// ---------------------------------------------------------------------------

// WebClientFrame is a browser -> gateway frame. Except for the agent_request pass-through
// arm, all other arms are gateway-local operations (answered from the gateway's own state,
// without a round trip to the desktop).
message WebClientFrame {
  // Request correlation id, generated by the client and echoed back on the response
  // frame; empty for broadcast events and heartbeat frames.
  string request_id = 1;
  // Target Agent id. Required for agent_request / status_get / chat_command / chat_prepare /
  // workspace_*; ignored by hello / pong / agent_list and the global conversation query arms.
  string agent_id = 13;

  oneof payload {
    ClientHello hello = 2;
    // Pass-through request: after validating the allowlist and quotas, the gateway
    // forwards it to the desktop (request_id is namespaced per connection to prevent collisions).
    GatewayEnvelope agent_request = 3;
    StatusGetRequest status_get = 4;
    ChatCommandRequest chat_command = 5;
    ChatPrepareRequest chat_prepare = 6;
    ChatSubscribeRequest chat_subscribe = 7;
    ChatUnsubscribeRequest chat_unsubscribe = 8;
    ChatActivitiesRequest chat_activities = 9;
    WorkspaceSubscribeRequest workspace_subscribe = 10;
    WorkspaceUnsubscribeRequest workspace_unsubscribe = 11;
    PongFrame pong = 12;
    // Agent directory query: status list of all registered Agents (including offline ones).
    AgentListRequest agent_list = 14;
  }
}

// WebServerFrame is a gateway -> browser frame.
message WebServerFrame {
  // Correlated responses fill in the request id; empty for server-initiated pushes (broadcast/heartbeat).
  string request_id = 1;
  // Source/target Agent id: target-type responses echo the target declared by the request,
  // and Agent event broadcasts mark the source; empty for hello / ping / ack / agent_list
  // and global aggregate frames. Clients filter events for inactive Agents by this field.
  string agent_id = 16;

  oneof payload {
    ServerHello hello = 2;
    // Pass-through response: the business envelope returned by the desktop (including the error=99 error arm).
    AgentEnvelope agent_response = 3;
    // Gateway-local error (authentication, validation, offline, etc.).
    ErrorResponse local_error = 4;
    PingFrame ping = 5;
    // The responses for status_get / chat_prepare and the status broadcast share one status normalizer.
    StatusEvent status = 6;
    ChatSubscribeResult chat_subscribed = 7;
    ChatCommandAccepted chat_accepted = 8;
    ChatActivitiesResult chat_activities = 9;
    ChatStreamEvent chat_event = 10;
    ChatCommandUpdate chat_command_update = 11;
    ChatSubscriptionReset chat_subscription_reset = 12;
    ChatActivityEvent chat_activity = 13;
    AckResult ack = 14;
    ChatCancelResult chat_cancelled = 15;
    AgentListResult agent_list = 17;

    // Broadcast events: business messages emitted by the session layer are forwarded
    // directly with zero reshaping.
    HistorySyncEvent history_event = 20;
    SettingsSyncEvent settings_event = 21;
    TerminalEvent terminal_event = 22;
    SftpEvent sftp_event = 23;
    ChatQueueEvent chat_queue_event = 24;
    TunnelStateSnapshot tunnel_state = 25;
    ManagedProcessSnapshot process_state = 26;
    WorkspaceActivityEvent workspace_activity = 27;
  }
}

// AgentListRequest queries the Agent directory; the response is AgentListResult.
message AgentListRequest {}

// AgentListResult returns the status of all registered Agents (including offline entries,
// for directory rendering), reusing the StatusEvent normalizer and sorted by agent_id.
message AgentListResult {
  repeated StatusEvent agents = 1;
}

// ---------------------------------------------------------------------------
// Desktop link (/ws/v2/agent)
// ---------------------------------------------------------------------------

// AgentClientFrame is a desktop -> gateway frame.
message AgentClientFrame {
  oneof payload {
    ClientHello hello = 1;
    AgentEnvelope envelope = 2;
  }
}

// AgentServerFrame is a gateway -> desktop frame.
message AgentServerFrame {
  oneof payload {
    ServerHello hello = 1;
    GatewayEnvelope envelope = 2;
  }
}

// ---------------------------------------------------------------------------
// Terminal link (/ws/v2/terminal, shared by both ends)
// ---------------------------------------------------------------------------

// TerminalClientFrame is a client (browser or desktop) -> gateway frame.
message TerminalClientFrame {
  oneof payload {
    ClientHello hello = 1;
    TerminalStreamFrame frame = 2;
  }
}

// TerminalServerFrame is a gateway -> client frame.
message TerminalServerFrame {
  oneof payload {
    ServerHello hello = 1;
    TerminalStreamFrame frame = 2;
  }
}

// ---------------------------------------------------------------------------
// Gateway-local payloads (handled directly by the gateway and modeled in protobuf)
// ---------------------------------------------------------------------------

// StatusGetRequest requests a gateway-side runtime status snapshot (operation type: "status.get").
message StatusGetRequest {}

// StatusEvent mirrors the JSON shape of session.Status (fields correspond one-to-one).
message StatusEvent {
  bool online = 1;
  bool agent_ready = 2;
  bool chat_runtime_ready = 3;
  string agent_id = 4;
  string agent_version = 5;
  string session_id = 6;
  int64 connected_since = 7;
  int64 last_heartbeat = 8;
  string runtime_state = 9;
  int64 runtime_last_heartbeat = 10;
  string runtime_worker_id = 11;
  bool runtime_visible = 12;
  uint32 runtime_active_run_count = 13;
  // Populated only by the agent_list directory response; live status responses and
  // broadcasts leave it empty to avoid accessing the database on the hot status path.
  string name = 14;
}

// ChatPrepareRequest wakes/probes the desktop chat runtime (operation type: "chat.prepare");
// the response is StatusEvent.
message ChatPrepareRequest {
  string reason = 1;
}

// ChatSubscribeRequest subscribes to a conversation event stream (operation type:
// "chat.subscribe"); the outer WebClientFrame.agent_id must be non-empty, and conversations
// are isolated by (agent_id, conversation_id). after_seq + stream_epoch support reconnection
// replay: when the epoch does not match or the sequence number is out of range, the server
// sets reset and replays from the beginning.
message ChatSubscribeRequest {
  string conversation_id = 1;
  int64 after_seq = 2;
  string stream_epoch = 3;
}

// ChatRunActivity mirrors the JSON shape of session.RunActivity.
message ChatRunActivity {
  string run_id = 1;
  string state = 2;
  int64 started_seq = 3;
  // Unix millisecond timestamp.
  int64 updated_at_ms = 4;
  string tool_status = 5;
  bool tool_status_is_compaction = 6;
  string client_request_id = 7;
  // The following fields are populated only in the chat_activities list
  // (agent_id marks the Agent the run belongs to).
  string conversation_id = 8;
  string workdir = 9;
  string agent_id = 10;
}

// ChatRunSnapshot mirrors the JSON shape of session.RunSnapshot.
message ChatRunSnapshot {
  string run_id = 1;
  int64 revision = 2;
  // Snapshot rendered by the desktop; the content is dynamic JSON (carried as a string, not modeled).
  string entries_json = 3;
  string tool_status = 4;
  bool tool_status_is_compaction = 5;
  int64 as_of_seq = 6;
}

// ChatSubscribeResult is the response to chat_subscribe.
message ChatSubscribeResult {
  string conversation_id = 1;
  string stream_epoch = 2;
  int64 latest_seq = 3;
  bool reset = 4;
  ChatRunActivity activity = 5;
  ChatRunSnapshot snapshot = 6;
  // Replayed event sequence. The payload is shaped by chatwire into deeply dynamic JSON
  // and carried as bytes without additional proto modeling (re-modeling would fork
  // chatwire and yield no real benefit for compressed binary frames).
  repeated bytes events_json = 7;
}

// ChatUnsubscribeRequest cancels a subscription (operation type: "chat.unsubscribe");
// the response is AckResult.
message ChatUnsubscribeRequest {
  string conversation_id = 1;
}

// ChatActivitiesRequest queries running conversations (operation type: "chat.activities");
// answered solely from gateway state, so it also works when the desktop is offline.
message ChatActivitiesRequest {}

message ChatActivitiesResult {
  repeated ChatRunActivity running_conversations = 1;
}

// ChatStreamEvent is a single conversation event pushed after subscription.
message ChatStreamEvent {
  string conversation_id = 1;
  // Event sequence number (identical to the seq inside payload_json, allowing deduplication
  // without parsing the payload).
  int64 seq = 2;
  bytes payload_json = 3;
}

// ChatCommandAccepted is the response indicating a chat_command submission was accepted
// (the acceptance acknowledgement for chat_command).
message ChatCommandAccepted {
  string run_id = 1;
  string conversation_id = 2;
  int64 accepted_seq = 3;
  bool deduped = 4;
}

// ChatCommandUpdate pushes the pre-stage result of a command (bound / queued_in_gui / failed),
// mirroring session.ChatCommandUpdate.
message ChatCommandUpdate {
  string run_id = 1;
  string client_request_id = 2;
  string conversation_id = 3;
  string phase = 4;
  string error_code = 5;
  string message = 6;
}

// ChatSubscriptionReset notifies the client that a conversation stream was dropped due to
// throttling and must be re-subscribed (after_seq resumes from the breakpoint).
message ChatSubscriptionReset {
  string conversation_id = 1;
}

// ChatCancelResult is the response to chat.cancel.
message ChatCancelResult {
  bool ok = 1;
  string run_id = 2;
  string conversation_id = 3;
}

// ChatActivityEvent broadcasts conversation activity state changes,
// mirroring session.ConversationActivityEvent.
message ChatActivityEvent {
  string conversation_id = 1;
  string run_id = 2;
  string client_request_id = 3;
  bool running = 4;
  string state = 5;
  string workdir = 6;
  int64 updated_at_ms = 7;
}

// WorkspaceSubscribeRequest subscribes to workspace activity (operation type:
// "workspace.subscribe"); the response is AckResult, and events are broadcast via the
// workspace_activity arm.
message WorkspaceSubscribeRequest {
  string workdir = 1;
}

// WorkspaceUnsubscribeRequest cancels the subscription; the response is AckResult.
message WorkspaceUnsubscribeRequest {
  string workdir = 1;
}
