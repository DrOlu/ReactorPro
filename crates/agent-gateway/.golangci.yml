# golangci-lint v2 -- gateway Go linting baseline (no linter existed before, so a pragmatic set was chosen): govet/staticcheck/unused
# cover correctness and dead code, while errcheck/ineffassign/misspell handle basic hygiene.
# Generated code (internal/proto/) is excluded from linting.
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - ineffassign
    - misspell
  exclusions:
    generated: lax
    rules:
      # Test code is allowed to ignore the return value of cleanup-style calls.
      - path: _test\.go
        linters: [errcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
