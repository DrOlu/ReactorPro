# buf code generation config (v2 schema). The Go plugin uses a mise-pinned version and a
# `module=` matching historical protoc, outputting to internal/proto/; the TS plugin
# protoc-gen-es is pinned by web/node_modules, outputting to web/src/lib/proto/gen/.
version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/liveagent/agent-gateway
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/lib/proto/gen
    opt: target=ts
inputs:
  - directory: .
