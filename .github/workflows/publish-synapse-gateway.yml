name: Publish synapse-gateway (PyPI + npm)

# Auto-update channel for the gateway distribution packages: whenever a
# gateway release is published (or this workflow is dispatched with a tag),
# rebuild the PyPI wheels and npm packages from that release's binaries and
# publish them — so pip/npm always track the gateway version-for-version.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.7.6
        required: true

permissions:
  contents: read
  id-token: write # PyPI trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/synapse-gateway
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Resolve the release tag
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::no release tag resolved"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "publishing synapse-gateway from $RELEASE_TAG"

      # Build tooling always comes from main; binaries are downloaded from the
      # release tag by scripts/build_synapse_gateway_packages.py. Checking out
      # the tag itself fails because v1.7.6 (and older) predate the builder.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build wheel setuptools twine

      # The gateway-release workflow may still be uploading assets when the
      # `released` event lands; the builder retries 404s with backoff.
      - name: Build packages from the release binaries
        run: python scripts/build_synapse_gateway_packages.py --release-tag "$RELEASE_TAG"

      - name: Verify staged packages
        run: |
          ls -l synapse-dist/pypi/ synapse-dist/npm/*/ 2>/dev/null | head -40
          twine check synapse-dist/pypi/*.whl

      # Token auth: OIDC trusted publishing is not registered on pypi.org yet
      # (`invalid-publisher`). SYNASSE_PYPI_TOKEN creates the project on first
      # upload. Attestations require OIDC, so they stay off. Do not fail-fast —
      # npm should still publish if PyPI is blocked.
      - name: Publish to PyPI
        id: pypi
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: synapse-dist/pypi
          skip-existing: true
          password: ${{ secrets.SYNASSE_PYPI_TOKEN }}
          attestations: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SYNASSE_NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_one() {
            local d="$1" name version out
            name=$(node -p "require('./${d}/package.json').name")
            version=$(node -p "require('./${d}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "already on registry: ${name}@${version} — skipping"
              return 0
            fi
            echo "publishing $d (${name}@${version})"
            if out=$(npm publish "$d" --access public 2>&1); then
              echo "$out"
              return 0
            fi
            echo "$out"
            # Replica lag: view 404s while the version is already reserved.
            if echo "$out" | grep -q "cannot publish over the previously published versions"; then
              echo "already published: ${name}@${version} — skipping"
              return 0
            fi
            return 1
          }
          for d in synapse-dist/npm/darwin-arm64 synapse-dist/npm/darwin-x64 \
                   synapse-dist/npm/linux-x64-gnu synapse-dist/npm/linux-arm64-gnu \
                   synapse-dist/npm/win32-x64 synapse-dist/npm/main; do
            publish_one "$d"
          done

      - name: Fail if a publish failed
        if: always() && (steps.pypi.outcome != 'success' || steps.npm.outcome != 'success')
        run: |
          echo "pypi=${{ steps.pypi.outcome }} npm=${{ steps.npm.outcome }}"
          exit 1
