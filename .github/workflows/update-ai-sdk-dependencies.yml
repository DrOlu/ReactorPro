name: Update AI SDK Dependencies

on:
  schedule:
    # Run at midnight every day (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-dependencies:
    name: Update AI SDK Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Install dependencies
        run: npm install
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Update AI SDK dependencies
        run: |
          # Define the AI SDK packages to update
          packages=(
            "ai"
            "@ai-sdk/provider"
            "@ai-sdk/provider-utils"
            "@ai-sdk/amazon-bedrock"
            "@ai-sdk/anthropic"
            "@ai-sdk/azure"
            "@ai-sdk/cerebras"
            "@ai-sdk/deepseek"
            "@ai-sdk/google"
            "@ai-sdk/google-vertex"
            "@ai-sdk/groq"
            "@ai-sdk/openai"
            "@openrouter/ai-sdk-provider"
            "@requesty/ai-sdk"
            "ollama-ai-provider-v2"
          )

          # Create changelog in memory (not as file)
          changelog="# AI SDK Dependencies Update\n\n| Package | From | To |\n|---------|------|----|"
          has_updates=false

          # patch-package stores per-package patches as patches/<name>+<ver>.patch,
          # where scoped names use '+' instead of '/' (e.g. @requesty+ai-sdk+3.5.0.patch).
          # Auto-bumping a patched package leaves the stale patch unappliable and
          # breaks the build, so such packages are skipped — regenerate the patch
          # manually (bump, re-apply the edit, `npx patch-package <pkg>`) to upgrade.
          has_patch() {
            local patch_name
            patch_name=$(echo "$1" | sed 's|/|+|g')
            ls patches/${patch_name}+*.patch 2>/dev/null | head -1 || true
          }

          # Update each package to latest stable version within the same major version
          for package in "${packages[@]}"; do
            echo "Checking $package..."

            # Skip packages carrying a local patch-package patch
            existing_patch=$(has_patch "$package")
            if [ -n "$existing_patch" ]; then
              echo "$package has a local patch ($existing_patch); skipping auto-bump (regenerate the patch manually to upgrade)"
              continue
            fi
            # Get current version from package.json. Most packages live in
            # "dependencies"; @ai-sdk/provider-utils is pinned only via the
            # "overrides" block (it is a transitive dep of the @ai-sdk/*
            # providers), so fall back to a string-valued override entry.
            current_version=$(cat package.json | jq -r ".dependencies[\"$package\"] // (if (.overrides[\"$package\"] | type) == \"string\" then .overrides[\"$package\"] else empty end)")
            if [ -z "$current_version" ]; then
              echo "Package $package not found in dependencies or overrides, skipping..."
              continue
            fi

            # Normalize current version (remove caret and leading v)
            current_clean=$(echo $current_version | sed 's/[\^v]//')

            # Extract major version from current version
            current_major=$(echo $current_clean | cut -d. -f1)

            # Get all versions for the package
            all_versions=$(npm view $package versions --json 2>/dev/null || echo "[]")

            # Filter versions to get the latest within the same major version
            # Sort versions and find the latest matching current major
            latest_same_major=$(echo "$all_versions" | \
              jq -r --arg major "$current_major" \
                '[.[] | select(. | match("^[0-9]+\\.[0-9]+\\.[0-9]+$") != null)] | 
                 map(. as $v | split(".") | {major: (.[0] | tonumber), minor: (.[1] | tonumber), patch: (.[2] | tonumber), original: $v}) | 
                 map(select(.major == ($major | tonumber))) | 
                 sort_by(.major, .minor, .patch) | reverse | 
                 .[0].original // empty')

            # If no versions found or parsing failed, fallback to current version
            if [ -z "$latest_same_major" ]; then
              latest_same_major=$current_clean
            fi

            echo "Current: $current_version, Latest (same major $current_major): $latest_same_major"

            # Normalize latest version for comparison (remove caret and leading v)
            latest_clean=$(echo $latest_same_major | sed 's/[\^v]//')

            # Update if different
            if [ "$current_clean" != "$latest_clean" ]; then
              echo "Updating $package from $current_version to $latest_same_major"
              # Write the new version into package.json for the direct
              # dependency (if present) and the overrides entry (if present and
              # a plain string — object overrides like the sharp redirect are
              # left untouched). This keeps overrides-only transitive pins such
              # as @ai-sdk/provider-utils in sync with the providers that need
              # them. The lockfile is reconciled in a single
              # `npm install --ignore-scripts` after the loop. We avoid
              # `npm install <pkg>@<ver>` because it aborts with EOVERRIDE when
              # the package is also pinned in overrides, and we avoid a bare
              # `npm install` here because it runs the postinstall
              # (patch-package), which breaks on stale per-version patches.
              tmp=$(mktemp)
              jq --arg pkg "$package" --arg ver "$latest_same_major" \
                '(if .dependencies[$pkg] then .dependencies[$pkg] = $ver else . end) | (if (.overrides[$pkg] | type) == "string" then .overrides[$pkg] = $ver else . end)' \
                package.json > "$tmp" && mv "$tmp" package.json
              changelog="$changelog\n| $package | $current_version | $latest_same_major |"
              has_updates=true
            else
              echo "$package is already up to date within major version $current_major"
            fi
          done

          # Reconcile package-lock.json with the edited package.json in one pass.
          # --ignore-scripts skips the postinstall (electron-builder + patch-package),
          # which is unnecessary for a dependency bump and would fail on stale
          # per-version patches.
          if [ "$has_updates" = true ]; then
            npm install --ignore-scripts
          fi

          # Save changelog to environment variable for PR (only if there are updates)
          if [ "$has_updates" = true ]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_ENV
            echo -e "$changelog" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "CHANGELOG<<EOF" >> $GITHUB_ENV
            echo "No AI SDK dependencies needed updates." >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # --no-verify: skip the husky pre-commit hook (lint-staged + typecheck + test).
          # This automated dependency-bump only stages package.json/package-lock.json,
          # which don't match the *.{ts,tsx} lint-staged globs, so the hook errors with
          # "No staged files match any configured task". The resulting PR is still gated
          # by pr-check.yml (lint + typecheck + test), matching the convention in
          # update-llms-txt.yml.
          commit-options: '--no-verify'
          commit-message: "chore: update AI SDK dependencies to latest versions within same major version"
          title: "chore: update AI SDK dependencies"
          body: |
            ## Automated AI SDK Dependencies Update
            
            This PR updates AI SDK packages to their latest stable versions within the same major version (to avoid breaking changes).
            
            ${{ env.CHANGELOG }}
            
            ---
            
            🤖 This PR was created automatically by the [Update AI SDK Dependencies](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.
          branch: chore/update-ai-sdk-dependencies
          delete-branch: true
          labels: |
            dependencies
            automated
          assignees: ${{ github.actor }}
