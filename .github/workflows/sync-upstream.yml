name: Sync from Upstream

# Keeps ReactorPro current with Stack-Cairn/LiveAgent while guaranteeing that
# ReactorPro branding and the English-only policy are re-applied afterwards.
#
# Strategy: merge upstream into a dedicated branch, run the idempotent
# `scripts/reactorpro-rebrand.mjs` to restore branding and prune files ReactorPro
# intentionally removed, then open a pull request. The pull request runs the
# normal CI, so an upstream change that breaks the build can never land silently.
# When CI is green the pull request auto-merges.

on:
  schedule:
    # Every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Sync even when upstream has not moved since the last sync"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Stack-Cairn/LiveAgent
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: sync/upstream

jobs:
  sync:
    name: Sync and rebrand
    runs-on: ubuntu-latest
    steps:
      # A personal access token is required, not GITHUB_TOKEN: pushes made with
      # the default token do not trigger other workflows, so the sync pull
      # request would never run CI. It also allows opening the pull request.
      - name: Checkout ReactorPro
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        id: upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          head="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          last="$(cat .upstream-commit 2>/dev/null || echo none)"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "last=${last}" >> "$GITHUB_OUTPUT"
          if [ "${head}" = "${last}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream is unchanged (${head}). Nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream moved: ${last} -> ${head}"
          fi

      - name: Merge upstream
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git checkout -B "${SYNC_BRANCH}" origin/main
          # Favour upstream on content conflicts; branding is re-applied below.
          git merge "upstream/${UPSTREAM_BRANCH}" \
            --no-edit \
            -X theirs \
            --allow-unrelated-histories || true
          if git ls-files --unmerged | grep -q .; then
            echo "Resolving remaining conflicts in favour of upstream"
            git checkout --theirs -- . 2>/dev/null || true
            git add -A
          fi

      - name: Prune files ReactorPro removed
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # `branding/prune.txt` lists paths this fork intentionally does not ship
          # (the Chinese README, the Chinese-provider STT feature). Merging
          # upstream re-adds them; delete them again so the fork stays clean.
          grep -vE '^\s*(#|$)' branding/prune.txt | while read -r path; do
            if [ -e "${path}" ]; then
              echo "Pruning ${path}"
              git rm -r -q --ignore-unmatch "${path}"
            fi
          done

      - name: Re-apply ReactorPro branding
        if: steps.upstream.outputs.changed == 'true'
        run: node scripts/reactorpro-rebrand.mjs

      - name: Record synced upstream commit
        if: steps.upstream.outputs.changed == 'true'
        run: echo "${{ steps.upstream.outputs.head }}" > .upstream-commit

      - name: Commit
        id: commit
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit after rebranding."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync from upstream ${UPSTREAM_REPO} (${{ steps.upstream.outputs.head }})"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.commit.outputs.pushed == 'true'
        run: git push --force-with-lease origin "${SYNC_BRANCH}"

      - name: Open or update pull request
        id: pr
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          UPSTREAM_HEAD: ${{ steps.upstream.outputs.head }}
        run: |
          set -euo pipefail
          title="chore: sync from upstream (${UPSTREAM_HEAD})"

          # Quoted heredoc delimiter: no expansion, so backticks and $ stay literal.
          {
            echo "Automated sync from ${UPSTREAM_REPO} at ${UPSTREAM_HEAD}."
            echo
            cat <<'PRBODY'
          ReactorPro branding has been re-applied by scripts/reactorpro-rebrand.mjs:
          product name, window title, bundle identifier, app icons, author metadata,
          and the English-only language policy. ReactorPro branding and the
          language guard are checked by the rebrand script on every sync.

          Reviewer note: upstream changes may reintroduce features or files that
          ReactorPro intentionally removed. The rebrand script fails when Chinese
          text reappears, so translate anything it flags before merging.
          PRBODY
          } > /tmp/pr-body.md

          existing="$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body-file /tmp/pr-body.md
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
          else
            gh pr create --base main --head "${SYNC_BRANCH}" \
              --title "${title}" --body-file /tmp/pr-body.md \
              --label "upstream-sync" 2>/dev/null \
              || gh pr create --base main --head "${SYNC_BRANCH}" \
                   --title "${title}" --body-file /tmp/pr-body.md
            number="$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number')"
            echo "number=${number}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --squash --auto \
            || echo "Auto-merge unavailable (branch protection or checks pending); the pull request stays open for review."
