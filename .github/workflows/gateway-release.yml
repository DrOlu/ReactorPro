name: Gateway Release

# Publishes standalone gateway binaries so a server can be set up by downloading
# one file — no Docker, no Go toolchain, no web build. The Docker image remains
# available via gateway-docker.yml; this is the alternative path.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.3.9
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: 22.19.0

jobs:
  webui:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @liveagent/gateway-webui...

      - name: Build Web UI
        run: pnpm --filter @liveagent/gateway-webui build

      # The gateway embeds this bundle, so a stale one ships stale branding. That
      # happened once: the served UI still carried the pre-rebrand product name
      # long after the rename, and nothing caught it because dist/ is gitignored
      # and never diffed.
      #
      # The name is written as a case-sensitive pattern rather than a literal so
      # that scripts/reactorpro-rebrand.mjs does not rewrite this guard itself —
      # it walks .github/. Case matters too: the lowercase form appears
      # legitimately in internal import paths and CSS classes, which are
      # deliberately left as upstream has them.
      #
      # Only the product name is checked, not CJK in general. The bundle carries
      # vendor language *data* — Monaco's zh-CN strings, SheetJS date-format
      # masks, highlight.js language keywords — which is not UI copy, and a
      # blanket scan fails on it. The repository-wide policy check below is the
      # authority on text, and it skips dist/ by design.
      - name: Verify the bundle is branded
        run: |
          set -euo pipefail
          dist=crates/agent-gateway/web/dist
          test -f "$dist/index.html" || { echo "::error::$dist/index.html is missing; the web build produced nothing"; exit 1; }
          if grep -rqIE 'Live[ _]?Agent' "$dist"; then
            echo "::error::the built web bundle still contains the pre-rebrand product name"
            exit 1
          fi
          if ! grep -rqI "ReactorPro" "$dist"; then
            echo "::error::the built web bundle does not mention the product name"
            exit 1
          fi
          echo "bundle is branded"

      # The repository's own branding and language policy. Nothing else runs this
      # at release time — only upstream sync applies the rebrand — so drift could
      # otherwise reach a published artifact unnoticed.
      - name: Verify branding policy
        run: node scripts/reactorpro-rebrand.mjs --check

      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: crates/agent-gateway/web/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: webui
    runs-on: ubuntu-latest
    strategy:
      # One failing target must not hide the others: partial platform coverage is
      # visible and fixable, a cancelled matrix is not.
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/agent-gateway/go.mod
          cache-dependency-path: crates/agent-gateway/go.sum

      # The Go binary embeds the Web UI, so every target needs the one bundle the
      # webui job built rather than five separate web builds.
      - uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: crates/agent-gateway/web/dist

      - name: Build
        working-directory: crates/agent-gateway
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="reactorpro-gateway-${GOOS}-${GOARCH}${ext}"
          worker="reactorpro-agentd-${GOOS}-${GOARCH}${ext}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/dist/$out" ./cmd/gateway
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/dist/$worker" ./cmd/agentd
          echo "built $out"
          echo "built $worker"

      # A mislabeled asset is worse than a missing one: it fails on the server,
      # far from the build. Check the header before publishing.
      - name: Verify binary architecture
        working-directory: dist
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          for out in "reactorpro-gateway-${GOOS}-${GOARCH}${ext}" "reactorpro-agentd-${GOOS}-${GOARCH}${ext}"; do
            info="$(file -b "$out")"
            echo "$out: $info"
            case "${GOOS}/${GOARCH}" in
              linux/amd64)   want="x86-64" ;;
              linux/arm64)   want="aarch64" ;;
              darwin/amd64)  want="x86_64" ;;
              darwin/arm64)  want="arm64" ;;
              windows/amd64) want="x86-64" ;;
            esac
            echo "$info" | grep -qi "$want" || { echo "::error::$out is not $want"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Pin to the triggering SHA (or the dispatch tag). Default checkout
      # verifies github.ref against github.sha and fails when a tag is moved
      # after the workflow starts — which is how we cut a follow-up fix onto
      # the same version.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: gateway-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum reactorpro-gateway-* reactorpro-agentd-* > SHA256SUMS
          cat SHA256SUMS

      # The desktop release workflow publishes to the same tag and may still be
      # building, so the release might not exist yet. Both paths are handled and
      # uploads are clobbered to stay re-runnable.
      - name: Publish assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/reactorpro-gateway-* dist/reactorpro-agentd-* dist/SHA256SUMS)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no gateway assets to publish"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
          # One file at a time so a single 422 (already exists / untagged draft)
          # cannot abort the rest. --clobber should overwrite; if it does not,
          # delete the colliding asset and retry. GitHub's uploads API also
          # returns intermittent HTTP 500s ("Error saving asset" / "Error
          # creating asset temp dir") on large binaries — retry with backoff
          # instead of failing the whole job on the first blip, and keep going
          # so one bad file does not leave the rest unpublished.
          failed=0
          for asset in "${assets[@]}"; do
            name=$(basename "$asset")
            uploaded=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$RELEASE_TAG" "$asset" --clobber; then
                uploaded=1
                break
              fi
              echo "upload $name failed (attempt $attempt), retrying..."
              gh release delete-asset "$RELEASE_TAG" "$name" --yes || true
              sleep $((attempt * 5))
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "::error::failed to upload $name after retries"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
