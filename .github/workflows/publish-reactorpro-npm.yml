name: Publish reactorpro (npm)

# The `reactorpro` npm package is the tiny CLI launcher (`npx reactorpro`) that
# installs the gateway / agentd binaries from the matching GitHub release. Keep
# it version-for-version with the app: whenever a release is published, push
# npm/reactorpro to the public registry.
#
# Also dispatchable with an existing tag to (re)publish or backfill, e.g.
#   gh workflow run publish-reactorpro-npm.yml -f tag=v1.7.5 -f npm_tag=backfill
# Pass npm_tag=backfill to add an older version without moving `latest`.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.7.12
        required: true
      npm_tag:
        description: npm dist-tag to publish under (default latest)
        required: false
        default: latest

permissions:
  contents: read

# One publish per tag; never let two runs race the same version.
concurrency:
  group: publish-reactorpro-npm-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      NPM_TAG: ${{ github.event.inputs.npm_tag || 'latest' }}
    steps:
      - name: Resolve the release tag
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::no release tag resolved"
            exit 1
          fi
          echo "publishing reactorpro from ${RELEASE_TAG} (npm dist-tag: ${NPM_TAG})"

      # Publish exactly what was tagged, not whatever main holds today.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Fail fast with a clear message if the token is missing or rotated,
      # instead of surfacing it only at the moment of a real publish.
      - name: Verify npm auth
        working-directory: npm/reactorpro
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REACTORPRO_NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::secret REACTORPRO_NPM_TOKEN is not set"
            exit 1
          fi
          echo "authenticated to npm as: $(npm whoami)"

      - name: Publish npm/reactorpro
        working-directory: npm/reactorpro
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REACTORPRO_NPM_TOKEN }}
        run: |
          set -euo pipefail

          name=$(node -p "require('./package.json').name")
          tag_version="${RELEASE_TAG#v}"
          committed=$(node -p "require('./package.json').version")

          # The launcher version must equal the release tag, and nothing in the
          # release pipeline bumps npm/reactorpro/package.json — so take the
          # version from the tag itself. The warning keeps any drift visible.
          if [ "${committed}" != "${tag_version}" ]; then
            echo "::warning::npm/reactorpro/package.json is at ${committed} but ${RELEASE_TAG} was released — publishing ${tag_version}"
            npm pkg set version="${tag_version}"
          fi

          version=$(node -p "require('./package.json').version")
          echo "package: ${name}@${version}"

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already on the registry: ${name}@${version} — nothing to do"
            exit 0
          fi

          out=""
          if out=$(npm publish --access public --tag "${NPM_TAG}" 2>&1); then
            echo "${out}"
            echo "published ${name}@${version} (dist-tag ${NPM_TAG})"
            exit 0
          fi

          echo "${out}"
          # Registry replica lag: `view` can 404 while the version is already
          # reserved, so treat "already published" as success.
          if printf '%s' "${out}" | grep -q "cannot publish over the previously published versions"; then
            echo "already published: ${name}@${version} — skipping"
            exit 0
          fi
          exit 1
